<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Org Luxury — Rare Watches &amp; Jewelry</title>
  <meta name="description" content="Org Luxury — hand-picked rare watches and jewelry, from our hands to yours. Rolex, Patek Philippe, Richard Mille and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/images/logo.png">
</head>
<body>

  <header class="site-header" id="siteHeader">
    <a class="wordmark" href="#/" data-i18n-href>
      <img src="/images/logo.png" alt="ORG Luxury" class="brand-logo">
      <span class="wordmark-org">Org</span> <span class="wordmark-lux" data-i18n="brand.luxury">Luxury</span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="#/" data-i18n="nav.home">Home</a>
      <a href="#/shop" data-i18n="nav.shop">Shop</a>
      <a href="#/about" data-i18n="nav.about">About</a>
    </nav>
    <div class="header-actions">
      <button class="lang-toggle" id="langToggle" aria-label="Switch language">عربي</button>
      <button class="cart-button" id="cartButton" aria-label="Open cart">
        <span data-i18n="nav.cart">Cart</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="/images/logo.png" alt="ORG Luxury" class="brand-logo brand-logo-lg">
        <span class="wordmark-org">Org</span> <span class="wordmark-lux" data-i18n="brand.luxury">Luxury</span>
        <p class="footer-tag" data-i18n="footer.tag">Rare watches &amp; jewelry — from our hands to yours.</p>
      </div>
      <div class="footer-links">
        <a href="#/" data-i18n="nav.home">Home</a>
        <a href="#/shop" data-i18n="nav.shop">Shop</a>
        <a href="#/about" data-i18n="nav.about">About</a>
        <a href="#/admin" data-i18n="nav.admin">Admin</a>
      </div>
      <div class="footer-contact">
        <a id="footerWhats" href="#" target="_blank" rel="noopener" data-i18n="footer.whatsapp">WhatsApp us</a>
        <a href="https://instagram.com/org_uae" target="_blank" rel="noopener" class="footer-ig" data-i18n="footer.instagram">Instagram @org_uae</a>
        <p class="footer-note" data-i18n="footer.note">Hand-picked pieces, delivered across the GCC.</p>
      </div>
    </div>
    <div class="footer-base"><span data-i18n="footer.rights">© Org Luxury. All pieces verified by our dealers.</span></div>
  </footer>

  <!-- Cart drawer -->
  <div class="drawer-overlay" id="drawerOverlay" hidden></div>
  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 data-i18n="cart.title">Your Selection</h2>
      <button class="icon-btn" id="cartClose" aria-label="Close cart">✕</button>
    </div>
    <div class="drawer-body" id="cartBody"></div>
    <div class="drawer-foot" id="cartFoot"></div>
  </aside>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="/js/app.js" defer></script>
  <script src="/js/admin.js" defer></script>
  <script src="/js/chatbot.js" defer></script>
</body>
</html>
